# Netlify reads this file on every deploy: it builds public/ from src/, then publishes it.
[build]
  publish = "public"
  # build the app, then copy the barcode-reading library in so scanning also works offline
  command = "node build.mjs && mkdir -p public/vendor && (cp node_modules/@zxing/library/umd/index.min.js public/vendor/zxing.min.js || echo 'zxing copy skipped: app will load it from the CDN')"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
